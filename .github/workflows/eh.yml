name: Clone

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL'
        required: true
        type: string
        default: 'https://github.com'
      release_tag:
        description: 'Release Tag'
        required: true
        type: string
        default: 'v1.0.0'

jobs:
  get-release:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: fetch specific url/tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_URL: ${{ inputs.url }}
          TAG: ${{ inputs.release_tag }}
        run: |
          gh release download "$TAG" \
            --repo "$REPO_URL" \
            --archive=zip \
            --output release.zip

      - name: create the nested folder
        run: |
          mkdir -p src/vendor/release-data

      - name: extract
        run: |
          unzip release.zip \
            -d src/vendor/release-data/

      - name: commit
        env:
          ACTOR_NAME: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
          REPO_URL: ${{ inputs.url }}
          TAG: ${{ inputs.release_tag }}
        run: |
          AUTO_EMAIL="${ACTOR_ID}+${ACTOR_NAME}@://github.com"
          
          git config user.name "$ACTOR_NAME"
          git config user.email "$AUTO_EMAIL"
          
          git add .
          
          git commit -m "Add release $TAG from $REPO_URL" \
                     -m "Co-authored-by: github-actions <github-actions@github.com>"
          git push
